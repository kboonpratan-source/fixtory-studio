<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixtory.studio — Operations HQ</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+Thai:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a; --bg2:#111111; --bg3:#181818;
  --border:rgba(255,255,255,.07);
  --accent:#e8855a; --accent2:#c96a40;
  --text:#f0ede8; --muted:#666460;
  --green:#1D9E75; --red:#e05a5a;
  --font-display:'Bebas Neue',sans-serif;
  --font-body:'Noto Sans Thai',sans-serif;
  --font-mono:'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-weight:300;line-height:1.6;min-height:100vh}
a{color:inherit}

/* top bar */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;border-bottom:1px solid var(--border);background:rgba(10,10,10,.94);backdrop-filter:blur(12px);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-text{font-family:var(--font-display);font-size:20px;letter-spacing:3px}
.brand-text span{color:var(--accent)}
.brand-sub{font-family:var(--font-mono);font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-left:10px;padding-left:10px;border-left:1px solid var(--border)}
.topbar-links{display:flex;gap:10px;align-items:center}
.topbar-links a{font-size:11px;color:var(--muted);text-decoration:none;letter-spacing:1px;text-transform:uppercase;border:1px solid var(--border);padding:7px 14px;transition:all .2s}
.topbar-links a:hover{border-color:var(--accent);color:var(--accent)}

/* layout */
.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 58px)}
.sidebar{border-right:1px solid var(--border);background:var(--bg2);padding:18px 10px;position:sticky;top:58px;align-self:start;height:calc(100vh - 58px);overflow-y:auto}
.side-btn{width:100%;display:flex;align-items:center;gap:10px;background:transparent;border:none;color:var(--muted);text-align:left;padding:10px 12px;font-family:var(--font-body);font-size:12.5px;cursor:pointer;border-radius:4px;transition:all .15s;letter-spacing:.3px}
.side-btn:hover{background:rgba(255,255,255,.04);color:var(--text)}
.side-btn.active{background:rgba(232,133,90,.1);color:var(--accent)}
.side-num{font-family:var(--font-mono);font-size:10px;opacity:.6;width:18px;flex-shrink:0}
.side-divider{height:1px;background:var(--border);margin:10px 6px}

.main{padding:32px 40px;max-width:1000px}
.panel{display:none}
.panel.active{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.p-tag{font-family:var(--font-mono);font-size:10px;color:var(--accent);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:8px}
.p-title{font-family:var(--font-display);font-size:clamp(30px,4vw,44px);letter-spacing:2px;line-height:1;margin-bottom:8px}
.p-sub{font-size:13px;color:var(--muted);max-width:640px;margin-bottom:28px}

/* kpi row */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--border);margin-bottom:28px}
.kpi-tile{background:var(--bg2);padding:16px 18px}
.kpi-label{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;font-family:var(--font-mono)}
.kpi-input-row{display:flex;align-items:baseline;gap:6px}
.kpi-input{background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--accent);font-family:var(--font-display);font-size:26px;letter-spacing:1px;width:100%;outline:none;padding:2px 0}
.kpi-input:focus{border-color:var(--accent)}
.kpi-unit{font-size:11px;color:var(--muted);font-family:var(--font-mono)}

/* checklist */
.block-title{font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin:0 0 12px;font-family:var(--font-mono)}
.checklist{border:1px solid var(--border);margin-bottom:28px}
.check-item{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.check-item:last-child{border-bottom:none}
.check-item:hover{background:rgba(255,255,255,.02)}
.check-box{width:16px;height:16px;border:1px solid var(--muted);border-radius:3px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s}
.check-item.done .check-box{background:var(--accent);border-color:var(--accent);color:#fff}
.check-text{font-size:13px;color:var(--text)}
.check-item.done .check-text{color:var(--muted);text-decoration:line-through}

.notes-area{width:100%;min-height:90px;background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:14px;font-family:var(--font-body);font-size:13px;outline:none;resize:vertical}
.notes-area:focus{border-color:var(--accent)}
.notes-saved{font-size:10px;color:var(--muted);font-family:var(--font-mono);margin-top:6px;min-height:14px}

/* overview */
.printer-row{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);margin-bottom:32px}
.printer-card{background:var(--bg2);padding:18px 20px}
.printer-name{font-family:var(--font-display);font-size:20px;letter-spacing:1px;margin-bottom:2px}
.printer-model{font-size:10px;color:var(--muted);font-family:var(--font-mono);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px}
.printer-select{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 10px;font-family:var(--font-body);font-size:12px;outline:none;width:100%;margin-bottom:8px}
.printer-job{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 10px;font-family:var(--font-body);font-size:12px;outline:none;width:100%}
.printer-select:focus,.printer-job:focus{border-color:var(--accent)}

.dept-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1px;background:var(--border)}
.dept-card{background:var(--bg2);padding:18px 20px;cursor:pointer;transition:background .15s}
.dept-card:hover{background:var(--bg3)}
.dept-card-top{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.dept-card-num{font-family:var(--font-mono);font-size:11px;color:var(--accent)}
.dept-card-name{font-family:var(--font-display);font-size:17px;letter-spacing:.5px}
.dept-card-tag{font-size:11px;color:var(--muted);margin-bottom:14px}
.progress-bar{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:6px}
.progress-fill{height:100%;background:var(--accent);transition:width .3s}
.progress-label{font-size:10px;color:var(--muted);font-family:var(--font-mono)}

@media(max-width:800px){
  .layout{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;display:flex;overflow-x:auto;gap:4px;border-right:none;border-bottom:1px solid var(--border)}
  .side-btn{white-space:nowrap}
  .side-divider{display:none}
  .main{padding:24px 18px}
  .printer-row{grid-template-columns:1fr}
}
</style>
</head>

  checklist: id => `fx_ops_checklist_${id}`,
  notes: id => `fx_ops_notes_${id}`,
  kpi: (id,i) => `fx_ops_kpi_${id}_${i}`,
  printer: id => `fx_ops_printer_${id}`,
  printerJob: id => `fx_ops_printerjob_${id}`
};

function getChecklist(dept){
  const raw = localStorage.getItem(LS.checklist(dept.id));
  if(raw){ try{ const arr = JSON.parse(raw); if(arr.length===dept.checklist.length) return arr; }catch(e){} }
  return dept.checklist.map(()=>false);
}
function setChecklist(dept, arr){ localStorage.setItem(LS.checklist(dept.id), JSON.stringify(arr)); }
function progressOf(dept){
  const arr = getChecklist(dept);
  const done = arr.filter(Boolean).length;
  return {done, total: arr.length, pct: Math.round(done/arr.length*100)};
}

function renderSidebar(){
  const sb = document.getElementById('sidebar');
  let html = `<button class="side-btn" data-panel="overview">📋&nbsp; Overview</button><div class="side-divider"></div>`;
  DEPARTMENTS.forEach(d=>{
    html += `<button class="side-btn" data-panel="${d.id}"><span class="side-num">${d.num}</span>${d.name}</button>`;
  });
  sb.innerHTML = html;
  sb.querySelectorAll('.side-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> showPanel(btn.dataset.panel));
  });
}

function overviewHtml(){
  let printerCards = PRINTERS.map(p=>{
    const status = localStorage.getItem(LS.printer(p.id)) || 'idle';
    const job = localStorage.getItem(LS.printerJob(p.id)) || '';
    return `
    <div class="printer-card">
      <div class="printer-name">${p.name}</div>
      <div class="printer-model">${p.model}</div>
      <select class="printer-select" data-pid="${p.id}">
        <option value="idle" ${status==='idle'?'selected':''}>🟢 ว่าง</option>
        <option value="printing" ${status==='printing'?'selected':''}>🟠 กำลังพิมพ์</option>
        <option value="maintenance" ${status==='maintenance'?'selected':''}>🔧 ซ่อมบำรุง</option>
      </select>
      <input class="printer-job" data-pid="${p.id}" placeholder="งานที่กำลังพิมพ์..." value="${job.replace(/"/g,'&quot;')}">
    </div>`;
  }).join('');

  let deptCards = DEPARTMENTS.map(d=>{
    const p = progressOf(d);
    return `
    <div class="dept-card" data-goto="${d.id}">
      <div class="dept-card-top"><span class="dept-card-num">${d.num}</span><span class="dept-card-name">${d.name}</span></div>
      <div class="dept-card-tag">${d.tag}</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${p.pct}%"></div></div>
      <div class="progress-label">${p.done}/${p.total} เสร็จแล้ว · ${p.pct}%</div>
    </div>`;
  }).join('');

  return `
  <div class="p-tag">Fixtory.studio · Operations HQ</div>
  <div class="p-title">ภาพรวมธุรกิจ 3D Printing</div>
  <div class="p-sub">เครื่องพิมพ์ 2 เครื่อง (Bambu Lab A1 Combo + P2S Combo) กับ 9 แผนกที่ขับเคลื่อนร้าน — เลือกแผนกด้านซ้ายเพื่อดูรายละเอียดและเช็คลิสต์งาน</div>
  <div class="block-title">สถานะเครื่องพิมพ์</div>
  <div class="printer-row">${printerCards}</div>
  <div class="block-title">9 แผนก</div>
  <div class="dept-grid">${deptCards}</div>
  `;
}

function kpiFontSize(value){
  const len = String(value).length;
  if(len <= 6) return '26px';
  if(len <= 12) return '19px';
  if(len <= 20) return '15px';
  return '13px';
}

function deptHtml(d){
  const kpis = d.kpis.map((k,i)=>{
    const val = localStorage.getItem(LS.kpi(d.id,i)) ?? k.def;
    return `
    <div class="kpi-tile">
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-input-row">
        <input class="kpi-input" style="font-size:${kpiFontSize(val)}" data-dept="${d.id}" data-idx="${i}" value="${String(val).replace(/"/g,'&quot;')}">
        <span class="kpi-unit">${k.unit}</span>
      </div>
    </div>`;
  }).join('');

  const arr = getChecklist(d);
  const items = d.checklist.map((text,i)=>`
    <div class="check-item ${arr[i]?'done':''}" data-dept="${d.id}" data-idx="${i}">
      <div class="check-box">${arr[i]?'✓':''}</div>
      <div class="check-text">${text}</div>
    </div>`).join('');

  const notes = localStorage.getItem(LS.notes(d.id)) || '';

  return `
  <div class="p-tag">แผนก ${d.num} · ${d.tag}</div>
  <div class="p-title">${d.name}</div>
  <div class="p-sub">${d.sub}</div>
  <div class="block-title">KPI / ตัวเลขติดตาม</div>
  <div class="kpi-row">${kpis}</div>
  <div class="block-title">Checklist</div>
  <div class="checklist">${items}</div>
  <div class="block-title">Notes</div>
  <textarea class="notes-area" data-dept="${d.id}" placeholder="บันทึกไอเดีย ข้อสังเกต หรือแผนงานของแผนกนี้...">${notes}</textarea>
  <div class="notes-saved" data-dept-saved="${d.id}"></div>
  `;
}

function renderMain(){
  const main = document.getElementById('main');
  let html = `<div class="panel" id="panel-overview">${overviewHtml()}</div>`;
  DEPARTMENTS.forEach(d=>{
    html += `<div class="panel" id="panel-${d.id}">${deptHtml(d)}</div>`;
  });
  main.innerHTML = html;
}

const notesTimers = {};

function bindEvents(){
  document.addEventListener('click', e=>{
    const card = e.target.closest('.dept-card');
    if(card){ showPanel(card.dataset.goto); return; }

    const item = e.target.closest('.check-item');
    if(item){
      const dept = DEPARTMENTS.find(d=>d.id===item.dataset.dept);
      const idx = Number(item.dataset.idx);
      const arr = getChecklist(dept);
      arr[idx] = !arr[idx];
      setChecklist(dept, arr);
      item.classList.toggle('done', arr[idx]);
      item.querySelector('.check-box').textContent = arr[idx] ? '✓' : '';
    }
  });

  document.addEventListener('change', e=>{
    if(e.target.matches('.printer-select')){
      localStorage.setItem(LS.printer(e.target.dataset.pid), e.target.value);
    }
    if(e.target.matches('.kpi-input')){
      localStorage.setItem(LS.kpi(e.target.dataset.dept, e.target.dataset.idx), e.target.value);
    }
  });

  document.addEventListener('input', e=>{
    if(e.target.matches('.kpi-input')){
      e.target.style.fontSize = kpiFontSize(e.target.value);
    }
    if(e.target.matches('.printer-job')){
      localStorage.setItem(LS.printerJob(e.target.dataset.pid), e.target.value);
    }
    if(e.target.matches('.notes-area')){
      const dept = e.target.dataset.dept;
      clearTimeout(notesTimers[dept]);
      notesTimers[dept] = setTimeout(()=>{
        localStorage.setItem(LS.notes(dept), e.target.value);
        const saved = document.querySelector(`[data-dept-saved="${dept}"]`);
        if(saved){ saved.textContent = '✓ บันทึกแล้ว'; setTimeout(()=> saved.textContent='', 1500); }
      }, 400);
    }
  });
}

function showPanel(id){
  document.querySelectorAll('.panel').forEach(p=> p.classList.remove('active'));
  document.querySelectorAll('.side-btn').forEach(b=> b.classList.toggle('active', b.dataset.panel===id));
  const panel = document.getElementById(`panel-${id}`);
  if(panel) panel.classList.add('active');
  if(id==='overview') renderOverviewInPlace();
  localStorage.setItem(LS.active, id);
  window.scrollTo({top:0});
}

function renderOverviewInPlace(){
  const panel = document.getElementById('panel-overview');
  if(panel){ panel.innerHTML = overviewHtml(); }
}

renderSidebar();
renderMain();
bindEvents();
showPanel(localStorage.getItem(LS.active) || 'overview');
</script>
</body>
</html>
