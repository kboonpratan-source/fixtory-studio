<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>รีวิวสินค้า · Fixtory Studio</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Chonburi&family=Prompt:wght@300;400;500;600&display=swap">
<script>try{var t=localStorage.getItem('fx-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
:root{--bg:#FAF8F4;--surface:#FFFFFF;--sunk:#F5E8DC;--soft:#E8C4A8;--ink:#2C2420;--muted:#76665C;--line:#EDE2D6;--accent:#C4714A;--accent-text:#A9572F;--olive:#6B7A4A;--danger:#B42318;--star:#E9A23B;--on-accent:#FFFFFF;--hero:#F5E8DC;--ok-bg:#EEF2E4;
  --f-display:"DM Serif Display","Chonburi",Georgia,serif;--f-body:"DM Sans","Prompt",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B1613;--surface:#26201C;--sunk:#322822;--soft:#5A4234;--ink:#F5E8DC;--muted:#BFAE9F;--line:#3A302A;--accent:#E08A60;--accent-text:#EFA07A;--olive:#A7B57E;--danger:#FF8A7D;--star:#F2B45A;--on-accent:#1B1613;--hero:#3A2D25;--ok-bg:#2B3020;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1B1613;--surface:#26201C;--sunk:#322822;--soft:#5A4234;--ink:#F5E8DC;--muted:#BFAE9F;--line:#3A302A;--accent:#E08A60;--accent-text:#EFA07A;--olive:#A7B57E;--danger:#FF8A7D;--star:#F2B45A;--on-accent:#1B1613;--hero:#3A2D25;--ok-bg:#2B3020;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left)) 60px max(16px,env(safe-area-inset-right))}
.hero{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;border-radius:24px;background:var(--hero);overflow:hidden;padding:clamp(16px,3vw,26px) clamp(18px,4vw,36px);margin-bottom:20px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:var(--soft);opacity:.55}
.hero::before{width:200px;height:200px;right:-60px;top:-100px}
.hero::after{width:110px;height:110px;right:110px;bottom:-70px;opacity:.35}
.hero>*{position:relative}
.lockup{display:flex;align-items:center;gap:clamp(12px,2vw,18px);text-decoration:none;color:var(--ink);min-width:0}
.lockup svg{width:clamp(32px,4.4vw,44px);height:clamp(46px,6.4vw,64px);flex:none}
.lockup-t{display:grid;gap:clamp(4px,1vw,10px);min-width:0}
.wm{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.1em;font-size:clamp(22px,3.6vw,36px);line-height:1;white-space:nowrap;margin:0;font-weight:400}
.wm em{font-style:normal;color:var(--accent)}
.wm-tag{font-family:var(--f-body);text-transform:uppercase;letter-spacing:.3em;font-size:clamp(9px,1.1vw,11.5px);color:var(--muted)}
@media (max-width:480px){.hero-link{display:none}.hero{padding:14px 16px}.wm{font-size:20px}}
.thm{border:0;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:999px;width:34px;height:30px;padding:0;display:inline-grid;place-items:center;cursor:pointer;color:var(--accent-text);flex:none}
.thm svg{width:16px;height:16px;display:block}
.hero-ctrl{display:flex;gap:8px;align-items:center}
.hero-link{border:0;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;color:var(--accent-text);text-decoration:none;white-space:nowrap}
h1{font-family:var(--f-display);font-weight:400;font-size:30px;margin:4px 0 2px;color:var(--accent)}
.sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.card{background:var(--surface);border-radius:20px;padding:18px;box-shadow:0 1px 2px rgba(44,36,32,.06),0 8px 24px -14px rgba(44,36,32,.25);margin-bottom:16px}
label.l{display:block;font-size:13.5px;font-weight:600;margin:14px 0 6px}
input[type=text],textarea{width:100%;border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font:inherit;color:inherit}
input:focus,textarea:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
textarea{min-height:96px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.prod{display:flex;gap:14px;align-items:center}
.prod img{width:64px;height:64px;border-radius:14px;object-fit:cover;background:var(--sunk);flex:none}
.prod b{display:block;font-size:17px;font-family:var(--f-display);font-weight:400;color:var(--accent-text);line-height:1.25}
.prod span{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stars{display:flex;gap:4px;margin-top:4px}
.stars button{border:0;background:none;padding:2px;cursor:pointer;line-height:0;color:var(--line)}
.stars button svg{width:38px;height:38px;display:block}
.stars button.on{color:var(--star)}
.stars button:focus-visible{outline:2.5px solid var(--accent);border-radius:8px}
.slab{font-size:13px;color:var(--muted);min-height:20px}
.pics{display:flex;flex-wrap:wrap;gap:8px}
.pics figure{margin:0;position:relative;width:84px;height:84px;border-radius:12px;overflow:hidden;background:var(--sunk)}
.pics img{width:100%;height:100%;object-fit:cover}
.pics figure button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(44,36,32,.72);color:#fff;cursor:pointer;font-size:15px;line-height:1}
.add{width:84px;height:84px;border:2px dashed var(--soft);border-radius:12px;display:grid;place-items:center;font-size:12.5px;color:var(--accent-text);cursor:pointer;background:var(--surface);text-align:center;line-height:1.3}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
.err{color:var(--danger);font-size:13.5px}
.done{background:var(--ok-bg);border-radius:14px;padding:12px 14px;font-size:14px;margin-top:12px}
.done b{color:var(--olive)}
.state{text-align:center;padding:40px 20px;color:var(--muted)}
.state b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--ink);margin-bottom:6px}
.note{font-size:12.5px;color:var(--muted);text-align:center;margin-top:8px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
<a class="lockup" href="https://fixtory-studio.pages.dev/catalog"><svg class="mark" viewBox="0 0 40 58" aria-hidden="true"><rect x="15.5" y="0" width="9" height="4.5" rx="1.6" fill="#C4714A"/><rect x="18" y="4" width="4" height="3.5" fill="#A85E3B"/><path d="M20 7.5L36 16.5L20 25.5L4 16.5Z" fill="#C97A53"/><path d="M4 16.5L20 25.5V28.5L4 19.5Z" fill="#A85E3B"/><path d="M36 16.5L20 25.5V28.5L36 19.5Z" fill="#B66A43"/><path d="M4 24L20 33L36 24V28.2L20 37.2L4 28.2Z" fill="#B4663F"/><path d="M4 29.2L20 38.2L36 29.2V33.4L20 42.4L4 33.4Z" fill="#9A5737"/><path d="M4 34.4L20 43.4L36 34.4V38.6L20 47.6L4 38.6Z" fill="#7C4830"/><path d="M4 39.6L20 48.6L36 39.6V43.8L20 52.8L4 43.8Z" fill="#5E3A2A"/><path d="M4 44.8L20 53.8L36 44.8V49L20 58L4 49Z" fill="#432D24"/></svg><span class="lockup-t"><span class="wm">FIXTORY<em>.STUDIO</em></span><span class="wm-tag">From Craft to Smart Design</span></span></a>
<span class="hero-ctrl"><a class="hero-link" href="https://fixtory-studio.pages.dev/catalog">ดูแคตตาล็อก</a><button class="thm" id="thmBtn" type="button" aria-label="สลับโหมดสว่าง/มืด"></button></span>
</section>
<main id="app"><div class="state"><div class="spin"></div>กำลังโหลดออเดอร์…</div></main>
</div>
<script>
// สลับโหมดสว่าง/มืด (จำค่าไว้ในเครื่อง) — ค่าเริ่มต้นตามมือถือ
(function(){const R=document.documentElement,K='fx-theme',SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>',MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></svg>';
  try{const t=localStorage.getItem(K);if(t==='light'||t==='dark')R.setAttribute('data-theme',t)}catch(e){}
  const now=()=>R.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const paint=()=>{const b=document.getElementById('thmBtn');if(!b)return;const d=now()==='dark';b.innerHTML=d?SUN:MOON;b.title=d?'โหมดสว่าง':'โหมดมืด'};
  document.getElementById('thmBtn').addEventListener('click',()=>{const t=now()==='dark'?'light':'dark';R.setAttribute('data-theme',t);try{localStorage.setItem(K,t)}catch(e){}paint()});
  paint();
})();
</script>
<script>
const GAS_URL="https://script.google.com/macros/s/AKfycbwfy2uHH4QJOM851_HBz3eoUCbwBvnZo1fGzf8DNChs5hS03Ml-335eATS3XTbifVYo9Q/exec";
const IMG={phapchoo:'phapchoo.jpg',sipbuddy:'sipbuddy.jpg',keycap:'kc/keycap-thumb.jpg',clips:'clips.jpg',bloombox:'cat/bloom-2.jpg'};
const NAME={phapchoo:'น้องพับชู่',sipbuddy:'Sip Buddy',keycap:'Alphabet Clicker',clips:'คลิปหนีบเอกสาร',bloombox:'Bloom Box'};
const LBL=['','ไม่พอใจ','พอใช้','ดี','ดีมาก','ชอบมาก ๆ'];
const STAR='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/></svg>';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q=new URLSearchParams(location.search),NO=(q.get('o')||'').toUpperCase(),TK=q.get('t')||'';
let ORDER=null;const ST={};
async function api(body){const r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)});return r.json()}
function fail(title,msg){$('#app').innerHTML='<div class="card state"><b>'+esc(title)+'</b>'+esc(msg)+'<div class="row" style="justify-content:center"><a class="btn ghost" href="https://fixtory-studio.pages.dev/catalog">ไปที่แคตตาล็อก</a></div></div>'}
async function load(){
  if(!/^FX\d+$/.test(NO)||!TK)return fail('ลิงก์ไม่ครบ','เปิดลิงก์รีวิวจาก QR ในกล่อง หรือลิงก์ที่ร้านส่งให้ในแชทอีกครั้ง');
  let r;try{r=await api({action:'rvOrder',o:NO,t:TK})}catch(e){return fail('เชื่อมต่อไม่ได้','ตรวจอินเทอร์เน็ตแล้วลองเปิดหน้านี้ใหม่อีกครั้ง')}
  if(!r||r.result!=='success')return fail(r&&r.code==='cancel'?'ออเดอร์ถูกยกเลิก':'เปิดรีวิวไม่ได้',(r&&r.message)||'ลองใหม่อีกครั้ง');
  ORDER=r;render();
}
function render(){
  const o=ORDER,items=o.items.filter(it=>it.pid!=='other');
  const prevNick=(o.reviews[0]||{}).nick||o.nick;
  $('#app').innerHTML='<h1>รีวิวสินค้า</h1><p class="sub">ออเดอร์ '+esc(o.no)+' · ขอบคุณที่อุดหนุน Fixtory Studio รีวิวของคุณช่วยร้านเล็ก ๆ ได้มาก</p>'+
    '<div class="card"><label class="l" for="nick" style="margin-top:0">ชื่อที่แสดงในรีวิว</label><input type="text" id="nick" maxlength="30" value="'+esc(prevNick)+'"><div class="hint">ตั้งเป็นชื่อเล่นได้ ร้านจะไม่แสดงชื่อจริง เบอร์โทร หรือที่อยู่</div></div>'+
    items.map(it=>'<div class="card" id="c-'+it.pid+'"></div>').join('')+
    '<p class="note">รีวิวจะขึ้นในแคตตาล็อกหลังร้านตรวจแล้ว · แก้ไขรีวิวได้ทุกเมื่อจากลิงก์เดิม</p>';
  items.forEach(it=>{const ex=o.reviews.find(x=>x.pid===it.pid);ST[it.pid]={stars:ex?ex.stars:0,text:ex?ex.text:'',keep:ex?ex.imgs.slice():[],add:[],sent:!!ex,editing:!ex,status:ex?ex.status:''};card(it)});
}
function card(it){
  const s=ST[it.pid],el=document.getElementById('c-'+it.pid);
  const head='<div class="prod"><img src="'+(IMG[it.pid]||'')+'" alt="" onerror="this.style.visibility=\'hidden\'"><div><b>'+esc(NAME[it.pid]||it.name)+'</b><span>'+esc(it.detail)+'</span></div></div>';
  if(!s.editing){
    el.innerHTML=head+'<div class="done"><b style="color:var(--star)">'+'★'.repeat(s.stars)+'</b> ส่งรีวิวแล้ว'+(s.status==='แสดง'?' · แสดงในแคตตาล็อกแล้ว':' · รอร้านตรวจก่อนขึ้นหน้าร้าน')+(s.text?'<div style="margin-top:4px;white-space:pre-line">'+esc(s.text)+'</div>':'')+'</div><div class="row"><button class="btn ghost" type="button" data-edit>แก้ไขรีวิว</button></div>';
    el.querySelector('[data-edit]').onclick=()=>{s.editing=true;card(it)};return;
  }
  el.innerHTML=head+
    '<label class="l">ให้คะแนน</label><div class="stars" role="radiogroup" aria-label="ให้ดาว">'+[1,2,3,4,5].map(n=>'<button type="button" role="radio" aria-checked="'+(s.stars===n)+'" aria-label="'+n+' ดาว" data-n="'+n+'" class="'+(n<=s.stars?'on':'')+'">'+STAR+'</button>').join('')+'</div><div class="slab">'+(LBL[s.stars]||'แตะดาวเพื่อให้คะแนน')+'</div>'+
    '<label class="l" for="t-'+it.pid+'">เล่าให้ฟังหน่อย <span style="font-weight:400;color:var(--muted)">(ไม่บังคับ)</span></label><textarea id="t-'+it.pid+'" maxlength="1000" placeholder="ชอบตรงไหน ใช้แล้วเป็นยังไง ได้รับของตรงกับที่สั่งไหม">'+esc(s.text)+'</textarea>'+
    '<label class="l">รูปสินค้าจริง <span style="font-weight:400;color:var(--muted)">(ไม่บังคับ สูงสุด 3 รูป)</span></label><div class="pics"></div>'+
    '<div class="row"><button class="btn primary" type="button" data-send>'+(s.sent?'บันทึกการแก้ไข':'ส่งรีวิว')+'</button>'+(s.sent?'<button class="btn ghost" type="button" data-cancel>ยกเลิก</button>':'')+'<span class="err" role="alert"></span></div>';
  el.querySelectorAll('.stars button').forEach(b=>b.onclick=()=>{s.stars=+b.dataset.n;el.querySelectorAll('.stars button').forEach(x=>{x.classList.toggle('on',+x.dataset.n<=s.stars);x.setAttribute('aria-checked',String(+x.dataset.n===s.stars))});el.querySelector('.slab').textContent=LBL[s.stars];el.querySelector('.err').textContent=''});
  el.querySelector('textarea').oninput=e=>{s.text=e.target.value};
  pics(it);
  el.querySelector('[data-send]').onclick=()=>send(it);
  const c=el.querySelector('[data-cancel]');if(c)c.onclick=()=>{s.editing=false;card(it)};
}
function pics(it){
  const s=ST[it.pid],box=document.querySelector('#c-'+it.pid+' .pics');
  const all=s.keep.map((u,i)=>({src:u,k:'keep',i})).concat(s.add.map((p,i)=>({src:p.url,k:'add',i})));
  box.innerHTML=all.map(p=>'<figure><img src="'+esc(p.src)+'" alt=""><button type="button" aria-label="ลบรูป" data-k="'+p.k+'" data-i="'+p.i+'">×</button></figure>').join('')+(all.length<3?'<label class="add">+ เพิ่มรูป<input type="file" accept="image/*" multiple hidden></label>':'');
  box.querySelectorAll('figure button').forEach(b=>b.onclick=()=>{(b.dataset.k==='keep'?s.keep:s.add).splice(+b.dataset.i,1);pics(it)});
  const inp=box.querySelector('input');if(inp)inp.onchange=async()=>{for(const f of [...inp.files].slice(0,3-all.length)){try{s.add.push(await shrink(f))}catch(e){}}pics(it)};
}
function shrink(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const m=1400,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);const d=c.toDataURL('image/jpeg',.85);ok({url:d,b64:d.split(',')[1],mime:'image/jpeg'})};im.onerror=()=>{URL.revokeObjectURL(u);no()};im.src=u})}
async function send(it){
  const s=ST[it.pid],el=document.getElementById('c-'+it.pid),err=el.querySelector('.err'),btn=el.querySelector('[data-send]');
  if(!s.stars){err.textContent='แตะดาวเพื่อให้คะแนนก่อนนะ';return}
  btn.disabled=true;btn.textContent='กำลังส่ง…';err.textContent='';
  let r;try{r=await api({action:'rvSubmit',o:NO,t:TK,pid:it.pid,stars:s.stars,text:s.text.trim(),nick:$('#nick').value.trim(),keepImgs:s.keep,photos:s.add.map(p=>({b64:p.b64,mime:p.mime}))})}catch(e){r=null}
  if(!r||r.result!=='success'){btn.disabled=false;btn.textContent=s.sent?'บันทึกการแก้ไข':'ส่งรีวิว';err.textContent=(r&&r.message)||'ส่งไม่สำเร็จ ลองอีกครั้ง';return}
  s.sent=true;s.editing=false;s.status='รออนุมัติ';s.keep=s.keep.concat(s.add.map(p=>p.url));s.add=[];card(it);
}
load();
</script>
</body>
</html>
