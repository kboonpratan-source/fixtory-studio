<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem("fx-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>รีวิว · Fixtory Studio</title>
<link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F1EB;--surface:#fff;--sunk:#F3ECE4;--ink:#2C2420;--muted:#7A6E66;--faint:#A89D94;--line:#E6DDD3;--accent:#C4704B;--accent-soft:#F5E3D8;--on-accent:#fff;--bad:#b3261e;--bad-bg:#fbe4e2;
  --ok:#23683d;--ok-bg:#e3f3e8;--warn:#8a5a12;--warn-bg:#fdf0dc;--info:#1c5cab;--info-bg:#e3eefb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1d1916;--surface:#2a2420;--sunk:#231e1b;--ink:#f3ebe3;--muted:#b5a89c;--faint:#8a7e74;--line:#3d342e;--accent:#e08a62;--accent-soft:#3a2a21;--on-accent:#1d1916;--bad:#ff8a80;--bad-bg:#3d2020;
  --ok:#8fd3a5;--ok-bg:#1f3527;--warn:#f0c27a;--warn-bg:#3a2d17;--info:#86b6ef;--info-bg:#1b2a3d}}
:root[data-theme="dark"]{--bg:#1d1916;--surface:#2a2420;--sunk:#231e1b;--ink:#f3ebe3;--muted:#b5a89c;--faint:#8a7e74;--line:#3d342e;--accent:#e08a62;--accent-soft:#3a2a21;--on-accent:#1d1916;--bad:#ff8a80;--bad-bg:#3d2020;
  --ok:#8fd3a5;--ok-bg:#1f3527;--warn:#f0c27a;--warn-bg:#3a2d17;--info:#86b6ef;--info-bg:#1b2a3d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Sarabun,system-ui,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
.wrap{max-width:860px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top a.back{color:var(--accent);font-weight:600;font-size:14px;text-decoration:none}
.top h1{font-size:22px;margin:0;flex:1}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0}
.iconbtn svg{width:18px;height:18px}.iconbtn.spin svg{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px;display:grid;gap:8px}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;font:inherit;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button i{font-style:normal;opacity:.7;margin-left:4px}
input[type=search],input[type=password]{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.list{display:grid;gap:10px}
.od{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.od.open{border-color:var(--accent)}
.hd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;cursor:pointer;width:100%;background:none;border:0;font:inherit;color:inherit;text-align:left}
.hd .l1{display:flex;gap:8px;align-items:baseline;min-width:0}.hd .no{font-weight:800;font-variant-numeric:tabular-nums}.hd .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hd .l2{grid-column:1;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd .rt{grid-row:1/3;grid-column:2;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.hd .rt b{font-variant-numeric:tabular-nums}
.pills{display:flex;gap:4px}
.pill{display:inline-block;border-radius:99px;padding:1px 8px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-wait{background:var(--warn-bg);color:var(--warn)}.p-make{background:var(--info-bg);color:var(--info)}.p-done{background:var(--ok-bg);color:var(--ok)}.p-x{background:var(--bad-bg);color:var(--bad)}.p-gray{background:var(--sunk);color:var(--muted)}
.bd{border-top:1px solid var(--line);padding:12px 14px 14px;display:grid;gap:12px}
.kv{display:grid;grid-template-columns:92px minmax(0,1fr);gap:6px 10px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv a{color:var(--accent)}
.items{font-size:14px;display:grid;gap:6px;background:var(--sunk);border-radius:12px;padding:10px 12px}
.items .it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.items .it span{color:var(--muted);font-size:13px;display:block}
.items .sum{border-top:1px dashed var(--line);padding-top:6px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13.5px}.items .sum b{font-size:15px}
.files{display:flex;gap:8px;flex-wrap:wrap}
.files a{font-size:13.5px;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:5px 12px}
.act{display:grid;gap:8px}
.act .lb{font-size:12.5px;color:var(--muted);font-weight:600}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{font:inherit;font-size:14px;font-weight:600;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 14px;cursor:pointer}
.opts button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.opts button:disabled{opacity:.5;cursor:default}
.danger{font:inherit;font-size:13.5px;font-weight:600;background:none;border:0;color:var(--bad);cursor:pointer;padding:4px 0;justify-self:start}
.confirm{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:10px 12px;font-size:13.5px;display:grid;gap:8px}
.confirm .row{display:flex;gap:8px}.confirm button{font:inherit;font-weight:600;border:0;border-radius:99px;padding:7px 14px;cursor:pointer}
.confirm .yes{background:var(--bad);color:#fff}.confirm .no{background:var(--surface);color:var(--ink)}
.saved{font-size:13px;color:var(--ok);min-height:1em}.saved.err{color:var(--bad)}
.empty{color:var(--muted);text-align:center;padding:30px 8px}
.rvl{display:flex;gap:6px;flex-wrap:wrap}.chip{font:inherit;font-size:13.5px;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
button.pri{font:inherit;font-weight:600;border:0;border-radius:999px;padding:10px 20px;cursor:pointer;background:var(--accent);color:var(--on-accent)}
.more{display:block;margin:12px auto 0;font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:8px 18px;cursor:pointer}
[hidden]{display:none!important}

.rv{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.rv .h{display:flex;gap:10px;align-items:flex-start}
.rv .h .who{flex:1;min-width:0}
.rv .h b{display:block}
.rv .h small{color:var(--muted);font-size:13px}
.rv .h small a{color:var(--accent);text-decoration:none;font-weight:600}
.st{color:#E9A23B;letter-spacing:1px;font-size:17px;white-space:nowrap}.st i{font-style:normal;color:var(--line)}
.rv .tx{white-space:pre-line;font-size:14.5px}
.rv .tx.none{color:var(--faint);font-style:italic}
.ph{display:flex;gap:6px;flex-wrap:wrap}.ph a{display:block;width:76px;height:76px;border-radius:10px;overflow:hidden;background:var(--sunk)}.ph img{width:100%;height:100%;object-fit:cover}
.rp{background:var(--sunk);border-radius:12px;padding:8px 12px;font-size:13.5px}.rp b{color:var(--accent)}
.rv textarea{width:100%;font:inherit;font-size:14px;padding:9px 11px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-height:64px;resize:vertical}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.acts button{font:inherit;font-size:13.5px;font-weight:600;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 13px;cursor:pointer}
.acts button.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.acts button.del{border:0;background:none;color:var(--bad);margin-left:auto}
.acts button:disabled{opacity:.5}
.sum{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.sum::-webkit-scrollbar{display:none}
.sum button{flex:none;font:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:13px;color:var(--muted);cursor:pointer}.sum b{display:block;color:var(--ink);font-size:14px}
.sum button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}.sum button[aria-pressed="true"] b{color:var(--accent)}
.pf{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}.pf a,.pf button{font:inherit;font-weight:600;color:var(--accent);text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.how{font-size:13.5px;color:var(--muted);line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="admin.html">← หลังร้าน</a><h1>รีวิว</h1>
    <button class="iconbtn" id="reload" type="button" aria-label="รีเฟรช"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button></div>

  <section id="login" class="card" hidden>
    <b>รหัสร้าน</b><p style="color:var(--muted);font-size:13.5px;margin:4px 0 10px">ใส่ครั้งเดียว เครื่องนี้จะจำไว้</p>
    <div style="display:flex;gap:8px"><input id="key" type="password" autocomplete="current-password" aria-label="รหัสร้าน"><button class="pri" id="go" type="button">เข้า</button></div>
    <p id="loginMsg" style="color:var(--bad);font-size:14px"></p>
  </section>

  <div id="main" hidden>
    <div class="tools">
      <div class="seg" id="seg" role="group" aria-label="กรองรีวิว"></div>
      <div class="sum" id="sum"></div>
      <div class="pf" id="pf" hidden></div>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>

<script>
const GAS_URL="https://script.google.com/macros/s/AKfycbwfy2uHH4QJOM851_HBz3eoUCbwBvnZo1fGzf8DNChs5hS03Ml-335eATS3XTbifVYo9Q/exec";
const $=s=>document.querySelector(s);
const store={get(k){try{return localStorage.getItem(k)||''}catch(e){return''}},set(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PN={phapchoo:'น้องพับชู่',sipbuddy:'Sip Buddy',keycap:'Alphabet Clicker',clips:'คลิปหนีบเอกสาร',bloombox:'Bloom Box',petmedbox:'กล่องจัดเก็บยาสัตว์'};
const FILTERS=[['รออนุมัติ','รออนุมัติ'],['แสดง','แสดงอยู่'],['ซ่อน','ซ่อน'],['all','ทั้งหมด']];
let KEY='',RV=[],F='รออนุมัติ',P='',BUSY=null,ASK=null,REPLY=null;
const stars=n=>'<span class="st" aria-label="'+n+' ดาว">'+'★'.repeat(n)+'<i>'+'★'.repeat(5-n)+'</i></span>';
async function api(body){return (await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({key:KEY},body))})).json()}
function show(v){$('#login').hidden=v!=='login';$('#main').hidden=v!=='main'}
async function load(){
  $('#reload').classList.add('spin');let r=null;
  try{r=await api({action:'rvAdmin'})}catch(e){}
  $('#reload').classList.remove('spin');
  if(!r){show('main');$('#list').innerHTML='<p class="empty">ดึงข้อมูลไม่ได้ ตรวจอินเทอร์เน็ต หรือว่า Deploy Apps Script แล้ว</p>';return}
  if(r.result!=='success'){
    if(/รหัส/.test(r.message||'')){store.set('fxLabelKey','');show('login');$('#loginMsg').textContent=r.message;return}
    show('main');$('#list').innerHTML='<div class="card how"><b style="color:var(--ink)">ยังไม่ได้ติดตั้งระบบรีวิว</b><br>วาง Reviews.gs และ Agents.gs ชุดใหม่ใน Apps Script รัน setupReviews แล้ว Deploy เป็น New version<br><span style="color:var(--faint)">('+esc(r.message||'')+')</span></div>';return}
  store.set('fxLabelKey',KEY);RV=r.reviews;show('main');render();
}
function render(){
  const PV=P?RV.filter(x=>x.pid===P):RV;
  const cnt=k=>k==='all'?PV.length:PV.filter(x=>x.status===k).length;
  $('#seg').innerHTML=FILTERS.map(([k,l])=>`<button type="button" data-f="${k}" aria-pressed="${F===k}">${l}<i>${cnt(k)}</i></button>`).join('');
  $('#seg').querySelectorAll('button').forEach(b=>b.onclick=()=>{F=b.dataset.f;ASK=null;REPLY=null;render()});
  const by={},pids=[];RV.forEach(x=>{if(!pids.includes(x.pid))pids.push(x.pid);if(x.status==='แสดง')(by[x.pid]=by[x.pid]||[]).push(x.stars)});
  $('#sum').innerHTML=pids.map(p=>{const a=by[p]||[],avg=a.length?a.reduce((s,n)=>s+n,0)/a.length:0,pend=RV.filter(x=>x.pid===p&&x.status==='รออนุมัติ').length;
    return`<button type="button" data-p="${esc(p)}" aria-pressed="${P===p}"><b>${esc(PN[p]||p)}</b>${a.length?`★ ${avg.toFixed(1)} · ${a.length} รีวิว`:'ยังไม่มีรีวิวที่แสดง'}${pend?` · รอ ${pend}`:''}</button>`}).join('');
  $('#sum').querySelectorAll('button').forEach(b=>b.onclick=()=>{P=P===b.dataset.p?'':b.dataset.p;if(P)F='all';ASK=null;REPLY=null;render()});
  $('#pf').hidden=!P;
  if(P)$('#pf').innerHTML=`<span>เฉพาะ <b style="color:var(--ink)">${esc(PN[P]||P)}</b></span><a href="catalog#p-${encodeURIComponent(P)}" target="_blank" rel="noopener">ดูหน้าสินค้าในแคตตาล็อก ↗</a><button type="button" id="pfx">แสดงทุกสินค้า</button>`;
  if(P)$('#pfx').onclick=()=>{P='';render()};
  const L=PV.filter(x=>F==='all'||x.status===F);
  $('#list').innerHTML=L.length?L.map(card).join(''):`<p class="empty">${F==='รออนุมัติ'?'ไม่มีรีวิวรออนุมัติ 🎉<br><span style="font-size:13.5px">ส่งลิงก์รีวิวให้ลูกค้าได้จากหน้าออเดอร์ หรือใส่ QR บนใบปะหน้า</span>':'ไม่มีรีวิวในกลุ่มนี้'}</p>`;
  bind();
}
function card(x){
  const d=new Date(x.d),busy=BUSY===x.id;
  return `<article class="rv" id="r-${esc(x.id)}">
    <div class="h"><div class="who"><b>${esc(PN[x.pid]||x.product)}</b><small>${esc(x.nick)} · <a href="orders.html#${esc(x.no)}">${esc(x.no)}</a> · ${isNaN(d)?'':d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'})}</small></div>${stars(x.stars)}</div>
    ${x.text?`<div class="tx">${esc(x.text)}</div>`:'<div class="tx none">ให้ดาวอย่างเดียว ไม่มีข้อความ</div>'}
    ${x.imgs.length?`<div class="ph">${x.imgs.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}=w300" alt="รูปจากลูกค้า" loading="lazy"></a>`).join('')}</div>`:''}
    ${REPLY===x.id?`<textarea id="rp" maxlength="500" placeholder="ตอบกลับลูกค้า (แสดงใต้รีวิวในแคตตาล็อก)">${esc(x.reply)}</textarea><div class="acts"><button class="go" data-savereply="${esc(x.id)}" type="button">บันทึกคำตอบ</button><button data-noreply type="button">ยกเลิก</button></div>`
      :x.reply?`<div class="rp"><b>ร้านตอบ:</b> ${esc(x.reply)}</div>`:''}
    ${ASK===x.id?`<div class="confirm">ลบรีวิวนี้ถาวร? (ถ้าแค่ไม่อยากให้ขึ้นหน้าร้าน ใช้ "ซ่อน" แทน)<div class="row"><button class="yes" data-del="${esc(x.id)}" type="button">ลบ</button><button class="no" data-nodel type="button">ไม่ลบ</button></div></div>`:''}
    <div class="acts">${x.status!=='แสดง'?`<button class="go" data-st="แสดง" data-id="${esc(x.id)}" type="button"${busy?' disabled':''}>✓ แสดงในแคตตาล็อก</button>`:''}${x.status!=='ซ่อน'?`<button data-st="ซ่อน" data-id="${esc(x.id)}" type="button"${busy?' disabled':''}>ซ่อน</button>`:''}${REPLY!==x.id?`<button data-reply="${esc(x.id)}" type="button">${x.reply?'แก้คำตอบ':'ตอบกลับ'}</button>`:''}<button class="del" data-askdel="${esc(x.id)}" type="button">ลบ</button></div>
    <div class="saved" id="sv-${esc(x.id)}"></div>
  </article>`;
}
function bind(){
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>act(b.dataset.id,{action:'rvSet',status:b.dataset.st},x=>{x.status=b.dataset.st}));
  document.querySelectorAll('[data-reply]').forEach(b=>b.onclick=()=>{REPLY=b.dataset.reply;ASK=null;render();const t=$('#rp');if(t)t.focus()});
  document.querySelectorAll('[data-noreply]').forEach(b=>b.onclick=()=>{REPLY=null;render()});
  document.querySelectorAll('[data-savereply]').forEach(b=>b.onclick=()=>{const v=$('#rp').value;act(b.dataset.savereply,{action:'rvSet',reply:v},x=>{x.reply=v.trim();REPLY=null})});
  document.querySelectorAll('[data-askdel]').forEach(b=>b.onclick=()=>{ASK=b.dataset.askdel;REPLY=null;render()});
  document.querySelectorAll('[data-nodel]').forEach(b=>b.onclick=()=>{ASK=null;render()});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>act(b.dataset.del,{action:'rvDelete'},x=>{RV=RV.filter(y=>y!==x);ASK=null}));
}
async function act(id,body,apply){
  const x=RV.find(y=>y.id===id);if(!x)return;BUSY=id;render();
  let r=null;try{r=await api(Object.assign({id},body))}catch(e){}
  BUSY=null;
  if(r&&r.result==='success'){apply(x);render()}
  else{render();const s=document.getElementById('sv-'+id);if(s){s.className='saved err';s.textContent='บันทึกไม่สำเร็จ'+(r&&r.message?': '+r.message:'')}}
}
$('#reload').onclick=load;
$('#go').onclick=()=>{KEY=$('#key').value.trim();if(KEY){$('#loginMsg').textContent='';load()}};
$('#key').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click()});
KEY=store.get('fxLabelKey');if(KEY)load();else show('login');
</script>
<style>.pw{position:relative;flex:1;min-width:0}.pw input{width:100%;font:inherit;padding:11px 46px 11px 12px!important;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);box-sizing:border-box}.pw .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:none;color:var(--muted,#7A6E66);display:grid;place-items:center;cursor:pointer;padding:0;border-radius:10px;box-shadow:none}.pw .eye svg{width:20px;height:20px}</style>
