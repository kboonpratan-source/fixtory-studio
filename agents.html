<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem("fx-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ลิงก์ตัวแทน · Fixtory Studio</title>
<link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F1EB;--surface:#fff;--sunk:#F3ECE4;--ink:#2C2420;--muted:#7A6E66;--faint:#A89D94;--line:#E6DDD3;--accent:#C4704B;--accent-soft:#F5E3D8;--on-accent:#fff;--bad:#b3261e;--ok:#23683d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1d1916;--surface:#2a2420;--sunk:#231e1b;--ink:#f3ebe3;--muted:#b5a89c;--faint:#8a7e74;--line:#3d342e;--accent:#e08a62;--accent-soft:#3a2a21;--on-accent:#1d1916;--bad:#ff8a80;--ok:#8fd3a5}}
:root[data-theme="dark"]{--bg:#1d1916;--surface:#2a2420;--sunk:#231e1b;--ink:#f3ebe3;--muted:#b5a89c;--faint:#8a7e74;--line:#3d342e;--accent:#e08a62;--accent-soft:#3a2a21;--on-accent:#1d1916;--bad:#ff8a80;--ok:#8fd3a5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Sarabun,system-ui,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.top a{color:var(--accent);font-weight:600;font-size:14px;text-decoration:none}.top h1{font-size:22px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 10px}
label{font-weight:600;font-size:14px}
.hint{font-size:13px;color:var(--muted);margin:4px 0 10px;line-height:1.6}
input{width:100%;font:inherit;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.links{display:grid;gap:10px;margin-top:14px}
.ln{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:6px}
.ln b{font-size:14.5px}.ln .who{font-size:12.5px;color:var(--muted)}
.ln code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--sunk);border-radius:8px;padding:7px 9px;overflow-wrap:anywhere;color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:600;font-size:13.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 14px;cursor:pointer}
button.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.ok{color:var(--ok);font-size:13px;min-height:1em}
.msg{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--sunk);border-radius:12px;padding:12px;font-size:14px;line-height:1.6}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}th{font-size:12.5px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td button{padding:4px 10px;font-size:12.5px}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.st{display:inline-block;border-radius:99px;padding:0 7px;font-size:11.5px;font-weight:600;margin-left:4px}.st.on{background:#e3f3e8;color:#23683d}.st.off{background:#fbe4e2;color:#b3261e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .st.on{background:#1f3527;color:#8fd3a5}:root:not([data-theme="light"]) .st.off{background:#3d2020;color:#ff8a80}}
:root[data-theme="dark"] .st.on{background:#1f3527;color:#8fd3a5}:root[data-theme="dark"] .st.off{background:#3d2020;color:#ff8a80}
button.warn{background:var(--bad);color:#fff;border-color:var(--bad)}.ok.bad{color:var(--bad)}
#agMsg:empty{display:none}
.offbox{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}.offbox summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted);padding:4px 0}
.alert{background:#fbe4e2;color:#b3261e;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:12px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .alert{background:#3d2020;color:#ff8a80}}
:root[data-theme="dark"] .alert{background:#3d2020;color:#ff8a80}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="admin.html">← หลังร้าน</a><h1>ลิงก์ตัวแทน</h1></div>

  <section class="card">
    <label for="nm">ชื่อตัวแทน</label>
    <p class="hint">ภาษาอังกฤษตัวเล็กหรือตัวเลข ไม่เว้นวรรค เช่น ploy, nan, jum — ชื่อนี้จะขึ้นในคอลัมน์ "Sale/ตัวแทนขาย" ของทุกออเดอร์ที่มาจากลิงก์ของเขา</p>
    <input id="nm" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="เช่น ploy">
    <div class="alert" id="offWarn" hidden></div>
    <div class="links" id="links" hidden></div>
    <div class="row" id="regRow" style="margin-top:12px" hidden><button type="button" id="reg">บันทึกชื่อนี้ในรายชื่อตัวแทน</button></div>
  </section>

  <section class="card" id="msgCard" hidden>
    <h2>ข้อความพร้อมส่งให้ตัวแทน</h2>
    <div class="msg" id="msg"></div>
    <div class="row" style="margin-top:10px"><button class="pri" id="copyMsg" type="button">คัดลอกข้อความ</button><button id="shareMsg" type="button" hidden>แชร์…</button><span class="ok" id="msgOk"></span></div>
  </section>

  <section class="card">
    <h2>รายชื่อตัวแทน</h2><p class="ok" id="agMsg"></p>
    <div id="agents"><p class="empty">กำลังโหลด…</p></div>
  </section>
</div>

<script>
const GAS_URL="https://script.google.com/macros/s/AKfycbwfy2uHH4QJOM851_HBz3eoUCbwBvnZo1fGzf8DNChs5hS03Ml-335eATS3XTbifVYo9Q/exec";
const SITE="https://fixtory-studio.pages.dev";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const baht=n=>'฿'+Math.round(n).toLocaleString('th-TH');
const KEY=(()=>{try{return localStorage.getItem('fxLabelKey')||''}catch(e){return''}})();
const clean=s=>s.toLowerCase().replace(/[^a-z0-9_-]/g,'');
function urls(n){const q='?sale='+encodeURIComponent(n);return[
  {k:'cat',t:'ลิงก์สำหรับลูกค้า',who:'ตัวแทนส่งลิงก์นี้ลิงก์เดียวให้ลูกค้า — ดูสินค้าครบทุกตัวแล้วกดสั่งได้เลย ยอดนับเป็นของตัวแทนอัตโนมัติ',u:SITE+'/catalog'+q},
  {k:'me',t:'ลิงก์สำหรับตัวแทนเอง',who:'ให้ตัวแทนเก็บไว้ดูยอดขาย ค่าคอม และอัปเดตสถานะออเดอร์ของตัวเอง — ห้ามส่งให้ลูกค้า',u:GAS_URL+q}]}
async function copy(t,el){try{await navigator.clipboard.writeText(t);if(el){el.textContent='คัดลอกแล้ว ✓';setTimeout(()=>el.textContent='',2000)}}catch(e){prompt('คัดลอกลิงก์นี้',t)}}
function render(){
  const n=clean($('#nm').value);if($('#nm').value!==n)$('#nm').value=n;
  if(!n){$('#links').hidden=true;$('#msgCard').hidden=true;$('#offWarn').hidden=true;$('#regRow').hidden=true;return}
  const ag=AG[n],off=ag&&ag.status==='เลิกแล้ว';
  $('#offWarn').hidden=!off;if(off)$('#offWarn').textContent=n+' ถูกปิดใช้งานอยู่ ออเดอร์จากลิงก์นี้จะไม่นับเป็นยอดของตัวแทน — เปิดใช้ได้ที่รายชื่อตัวแทนด้านล่าง';
  $('#regRow').hidden=!KEY||!!(ag&&ag.listed);$('#reg').onclick=()=>setAgent(n,'ใช้งาน',$('#reg'));
  const U=urls(n);
  $('#links').innerHTML=U.map(x=>`<div class="ln"><b>${x.t}</b><span class="who">${x.who}</span><code>${esc(x.u)}</code><div class="row"><button type="button" data-u="${esc(x.u)}" class="${x.k==='cat'?'pri':''}">คัดลอก</button><a href="${esc(x.u)}" target="_blank" rel="noopener"><button type="button">เปิดดู</button></a><span class="ok"></span></div></div>`).join('');
  $('#links').hidden=false;
  $('#links').querySelectorAll('button[data-u]').forEach(b=>b.onclick=()=>copy(b.dataset.u,b.parentNode.querySelector('.ok')));
  const m=`สวัสดีค่ะ ลิงก์ตัวแทนขาย Fixtory Studio ของ ${n}\n\n🛍 ส่งให้ลูกค้า (แคตตาล็อก + สั่งซื้อ):\n${U[0].u}\n\n📊 ไว้ดูยอดขาย/ค่าคอมของตัวเอง (ห้ามส่งให้ลูกค้า):\n${U[1].u}\n\nออเดอร์ที่ลูกค้าสั่งผ่านลิงก์แรก จะนับเป็นยอดของ ${n} อัตโนมัติ ค่าคอม 10% จ่ายทุกวันที่ 1 ของเดือนถัดไป (นับเฉพาะออเดอร์ที่จ่ายเงินและจัดส่งแล้ว)`;
  $('#msg').textContent=m;$('#msgCard').hidden=false;
  $('#copyMsg').onclick=()=>copy(m,$('#msgOk'));
  $('#shareMsg').hidden=!navigator.share;$('#shareMsg').onclick=()=>navigator.share({text:m}).catch(()=>{});
}
$('#nm').addEventListener('input',render);
let AG={};// key -> {name,status,o,sum}
async function loadAgents(){
  if(!KEY){$('#agents').innerHTML='<p class="empty">เข้าสู่ระบบที่หน้า <a href="admin.html" style="color:var(--accent)">หลังร้าน</a> ก่อน เพื่อดูรายชื่อตัวแทน</p>';return}
  let r;try{r=await (await fetch(GAS_URL+'?dash=1&key='+encodeURIComponent(KEY)+'&t='+Date.now())).json()}catch(e){}
  if(!r||r.result!=='success'){$('#agents').innerHTML='<p class="empty">ดึงข้อมูลไม่ได้</p>';return}
  AG={};const get=n=>{const k=n.toLowerCase();return AG[k]=AG[k]||{name:n,status:'ใช้งาน',o:new Set(),sum:0,listed:false}};
  (r.agents||[]).forEach(a=>{const g=get(a.name);g.status=a.status||'ใช้งาน';g.listed=true});
  r.rows.filter(x=>x.sale&&x.status!=='ยกเลิก'&&x.pay!=='ยกเลิก').forEach(x=>{const g=get(x.sale);g.o.add(x.no);g.sum+=x.price});
  renderAgents();render();
}
let ASK=null;
let SHOWOFF=false;
function renderAgents(){
  const all=Object.values(AG).sort((a,b)=>b.sum-a.sum||a.name.localeCompare(b.name));
  const on=all.filter(a=>a.status!=='เลิกแล้ว'),off=all.filter(a=>a.status==='เลิกแล้ว');
  const row=a=>{const isOff=a.status==='เลิกแล้ว',k=esc(a.name);
    return `<tr${isOff?' style="opacity:.75"':''}><td>${k} <span class="st ${isOff?'off':'on'}">${isOff?'เลิกแล้ว':'ใช้งาน'}</span></td><td class="num">${a.o.size}</td><td class="num">${baht(a.sum)}</td><td style="text-align:right;white-space:nowrap">`+
      (ASK===a.name.toLowerCase()?`<button type="button" class="${isOff?'pri':'warn'}" data-do="${k}" data-st="${isOff?'ใช้งาน':'เลิกแล้ว'}">${isOff?'ยืนยันเปิด':'ยืนยันปิด'}</button> <button type="button" data-no>ไม่</button>`
        :`${isOff?'':`<button type="button" data-n="${k}">ดูลิงก์</button> `}<button type="button" data-ask="${k}">${isOff?'เปิดใช้':'ปิดใช้'}</button>`)+`</td></tr>`};
  const table=list=>'<table><thead><tr><th>ตัวแทน</th><th class="num">ออเดอร์</th><th class="num">ยอดขาย</th><th></th></tr></thead><tbody>'+list.map(row).join('')+'</tbody></table>';
  if(ASK&&off.some(a=>a.name.toLowerCase()===ASK))SHOWOFF=true;
  $('#agents').innerHTML=(on.length?table(on):'<p class="empty">ยังไม่มีตัวแทนที่ใช้งานอยู่</p>')+
    (ASK&&AG[ASK]&&AG[ASK].status!=='เลิกแล้ว'?`<p class="hint" style="margin-top:10px">ปิดใช้แล้ว: ลูกค้าที่สั่งผ่านลิงก์ของ ${esc(AG[ASK].name)} ยังสั่งได้ แต่จะนับเป็นสั่งตรง (ไม่เข้าค่าคอม) และ ${esc(AG[ASK].name)} จะแก้สถานะออเดอร์ไม่ได้ ยอดเก่ายังอยู่ครบ</p>`:'')+
    (off.length?`<details class="offbox"${SHOWOFF?' open':''}><summary>ตัวแทนที่เลิกแล้ว (${off.length})</summary>${table(off)}<p class="hint">ชื่อยังเก็บไว้เพื่อประวัติยอดขายและค่าคอม ลิงก์ของคนเหล่านี้ไม่นับยอดแล้ว</p></details>`:'');
  const d=$('#agents details.offbox');if(d)d.addEventListener('toggle',()=>{SHOWOFF=d.open});
  $('#agents').querySelectorAll('button[data-n]').forEach(b=>b.onclick=()=>{$('#nm').value=b.dataset.n;render();scrollTo({top:0,behavior:'smooth'})});
  $('#agents').querySelectorAll('button[data-ask]').forEach(b=>b.onclick=()=>{ASK=b.dataset.ask.toLowerCase();renderAgents()});
  $('#agents').querySelectorAll('button[data-no]').forEach(b=>b.onclick=()=>{ASK=null;renderAgents()});
  $('#agents').querySelectorAll('button[data-do]').forEach(b=>b.onclick=()=>setAgent(b.dataset.do,b.dataset.st,b));
}
async function setAgent(name,status,btn){
  if(btn){btn.disabled=true;btn.textContent='กำลังบันทึก…'}
  let r=null;try{r=await (await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'setAgent',key:KEY,name,status})})).json()}catch(e){}
  if(r&&r.result==='success'){const k=name.toLowerCase();AG[k]=AG[k]||{name,o:new Set(),sum:0};AG[k].status=r.status;AG[k].listed=true;ASK=null;renderAgents();render();$('#agMsg').className='ok';$('#agMsg').textContent=`${name}: ${r.status==='เลิกแล้ว'?'ปิดใช้งานแล้ว':'เปิดใช้งานแล้ว'} ✓`}
  else{ASK=null;renderAgents();$('#agMsg').className='ok bad';$('#agMsg').textContent='บันทึกไม่สำเร็จ'+(r&&r.message?': '+r.message:' — ตรวจว่าติดตั้ง Agents.gs และ Deploy แล้ว')}
}
loadAgents();
</script>
<script src="nav.js?v=7"></script>
</body>
</html>
