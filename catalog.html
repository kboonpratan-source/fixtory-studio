/* Layout: Fixtory brand storefront — warm cream ground, terracotta (#C4714A, the brand DNA colour) for name, prices and actions, soft-terra pedestals behind products, dark-brown ink; detail opens as a centred two-column card (full screen on phones) */
:root{
  --bg:#FAF8F4; --surface:#FFFFFF; --sunk:#F5E8DC; --lav:#F5E8DC; --lav-2:#E8C4A8;
  --ink:#2C2420; --muted:#76665C; --line:#EDE2D6;
  --accent:#C4714A; --accent-text:#A9572F; --accent-ink:#FFFFFF; --accent-soft:#F5E8DC;
  --olive:#6B7A4A; --rose:#B89FA0;
  --draft:#8A5A00; --draft-soft:#FBEBCF; --danger:#B42318; --danger-soft:#FDE7E5;
  --shadow:0 1px 2px rgba(44,36,32,.06),0 8px 24px -12px rgba(44,36,32,.22);
  --f-display:"DM Serif Display","Chonburi",Georgia,serif;
  --f-body:"DM Sans","Prompt",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:20px; --r-s:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1B1613; --surface:#26201C; --sunk:#322822; --lav:#3A2D25; --lav-2:#5A4234;
  --ink:#F5E8DC; --muted:#BFAE9F; --line:#3A302A;
  --accent:#E08A60; --accent-text:#EFA07A; --accent-ink:#1B1613; --accent-soft:#3A2D25;
  --olive:#A7B57E; --rose:#CDB5B6;
  --draft:#F2B45A; --draft-soft:#3A2A12; --danger:#FF8A7D; --danger-soft:#3D1814;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1613; --surface:#26201C; --sunk:#322822; --lav:#3A2D25; --lav-2:#5A4234;
  --ink:#F5E8DC; --muted:#BFAE9F; --line:#3A302A;
  --accent:#E08A60; --accent-text:#EFA07A; --accent-ink:#1B1613; --accent-soft:#3A2D25;
  --olive:#A7B57E; --rose:#CDB5B6;
  --draft:#F2B45A; --draft-soft:#3A2A12; --danger:#FF8A7D; --danger-soft:#3D1814;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:400;letter-spacing:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:12px}

.top.hide-brand .brand{opacity:0;transform:translateY(-4px);pointer-events:none}
.top.overlay{position:fixed;left:0;right:0;transition:opacity .25s ease,transform .25s ease;box-shadow:0 1px 0 var(--line)}
.top.overlay.hide-brand{opacity:0;transform:translateY(-100%);pointer-events:none}
.top.overlay+#app .hero{margin-top:16px}
.hero-ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hero .lang{background:var(--surface)}
.hero .tabs{background:color-mix(in srgb,var(--surface) 55%,transparent)}
@media (prefers-reduced-motion:reduce){.top.overlay{transition:none}}
@media (prefers-reduced-motion:reduce){.brand{transition:none}}
.mark{width:28px;height:41px;display:grid;place-items:center;flex:none}
.logo-icon{width:100%;height:100%;display:block}
.wm{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.1em;color:var(--ink);white-space:nowrap}
.wm em{font-style:normal;color:var(--accent)}

.thm{border:0;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:999px;width:34px;height:30px;padding:0;display:inline-grid;place-items:center;cursor:pointer;color:var(--accent-text);flex:none}

@media (max-width:480px){.hero{flex-wrap:nowrap!important}.hero-ctrl{flex-direction:column;gap:6px;flex:none}}
.lang{border:0;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:999px;padding:5px 12px;font-family:var(--f-display);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--accent-text)}
.tabs{display:flex;gap:2px;background:var(--lav);padding:3px;border-radius:999px}

/* hero */
.hero{position:relative;margin-top:8px;display:flex!important;align-items:center;justify-content:space-between;flex-wrap:wrap;row-gap:14px;column-gap:20px;border-radius:24px;background:var(--lav);overflow:hidden;padding:clamp(18px,3vw,28px) clamp(20px,4vw,40px);display:grid;gap:10px;justify-items:start}

.hero>*{position:relative}
.eyebrow{font-family:var(--f-display);font-style:italic;font-size:16px;color:var(--accent-text);background:var(--surface);padding:2px 14px;border-radius:999px}

.hero h1{font-size:clamp(22px,3.6vw,36px);line-height:1;margin:0;font-weight:400}
.hero .wm-tag{font-size:clamp(9px,1.1vw,11.5px);letter-spacing:.3em;white-space:normal}
.hero .tag2{font-family:var(--f-display);font-style:italic;font-size:clamp(17px,2.6vw,21px);color:var(--ink);opacity:.85}
.swoosh{display:block;width:clamp(120px,30vw,220px);height:12px;margin-top:-2px}
.hero p{margin:0;color:var(--ink);max-width:52ch;font-size:clamp(15px,2.2vw,17px)}

/* filters */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:22px 18px}
.search{flex:1 1 240px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:999px;padding:9px 16px}
.search:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding-bottom:2px}
.chip{border:0;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:none}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;padding-bottom:48px}
.card{background:var(--surface);border:0;border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:8px;box-shadow:var(--shadow);transition:transform .2s ease,box-shadow .2s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(44,36,32,.08),0 18px 36px -16px rgba(44,36,32,.35)}

.badge{position:absolute;top:10px;left:10px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--draft-soft);color:var(--draft)}

.card-b{padding:14px 8px 8px;display:grid;gap:4px;flex:1}

.mats{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.h4-hint{font-family:var(--f-body);font-size:12.5px;font-weight:400;color:var(--muted);margin-left:8px}
.vars{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}

.sec li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--lav-2);transform:translateY(-1px)}

.gallery .main video{width:100%;height:100%;max-height:78vh;object-fit:contain;display:block;background:#000}

.vrow{display:flex;gap:8px}

async function shrink(file){
  try{
    if(!/^image\/(jpeg|png|webp)$/.test(file.type))return file;
    const bmp=await createImageBitmap(file);const max=1600;const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
    if(k===1&&file.size<1.5e6)return file;
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',.86));
  }catch(e){return file}
}

function buildDoc(){
  const SC='<'+'/script>';
  const json=JSON.stringify(S).replace(/</g,'\\u003c');
  const head='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>';
  return head+
    '<title>Fixtory Product Profile</title>\n\n'+
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="'+document.querySelector('link[rel=stylesheet]').getAttribute('href')+'">\n'+
    '<style id="css">'+$('#css').textContent+'</style>\n'+
    CHROME+'\n\n'+
    '<script type="application/json" id="data">'+json+SC+'\n\n'+

async function save(msg,view){
  if(!art||readOnly){toast('หน้านี้บันทึกไม่ได้ในมุมมองนี้');return}
  toast('กำลังบันทึก…',30000);
  try{try{sessionStorage.setItem('fx-msg',msg);sessionStorage.setItem('fx-view',view||'')}catch(e){}
    await art.publish(buildDoc());
  }catch(e){
    const c=e&&e.code;
    if(c==='conflict'){toast('มีคนบันทึกก่อนหน้า กำลังโหลดเวอร์ชันล่าสุด')}
    else if(c==='not_writer'||c==='not_granted'){readOnly=true;toast('มุมมองนี้แก้ไขไม่ได้ (ดูอย่างเดียว)',4000);route()}
    else if(c==='rate_limited'){toast('บันทึกถี่เกินไป รอสักครู่แล้วลองใหม่',4000)}
    else toast('บันทึกไม่สำเร็จ ('+(c||'error')+') ลองอีกครั้ง',4000);
  }
}

/* ---------- boot ---------- */
function start(){
  try{const m=sessionStorage.getItem('fx-msg'),v=sessionStorage.getItem('fx-view');if(m){sessionStorage.removeItem('fx-msg');sessionStorage.removeItem('fx-view');if(v&&!location.hash.startsWith('#p-'))history.replaceState(null,'','#'+v);setTimeout(()=>toast(m),300)}}catch(e){}
  route();
  if(!window.claude||!window.claude.use)return;
  (async()=>{
    try{
      const user=await claude.use('user');
      let ok=false;try{ok=!!(user&&(await user.canEdit()))}catch(e){}
      if(!ok)return;
      art=await claude.use('artifact');
      assets=await claude.use('assets');
      if(!art)return;
      canEdit=true;route();
    }catch(e){}
  })();
}
start();
})();
